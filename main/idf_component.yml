## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=5.5.0'
  espressif/esp_websocket_client: "^1.4.0"
  # esp_hosted: WiFi/BT via ESP32-C6 coprocessor (required for ESP32-P4 Nano)
  # Provides transparent esp_wifi API backed by C6 over SDIO.
  # Not used on ESP32-S3 (has onboard WiFi); harmless to include for both targets.
  espressif/esp_hosted: ">=2.0.0"
